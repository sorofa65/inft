<!DOCTYPE html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>প্লেয়ার কার্ড – INFT</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#071022;color:#fff;font-family:'Hind Siliguri',Poppins,sans-serif}.w{max-width:1100px;margin:0 auto;padding:14px;display:grid;grid-template-columns:330px 1fr;gap:16px}
@media(max-width:800px){.w{grid-template-columns:1fr}}.c{background:#101c3a;border-radius:14px;padding:14px}label{font-size:12px;color:#9db0d8;display:block;margin:8px 0 3px}
input,select{width:100%;padding:8px;border-radius:8px;border:1px solid #2c4f95;background:#0a1530;color:#fff;font:inherit}.s{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
button{width:100%;margin-top:8px;padding:11px;border:0;border-radius:10px;font:700 14px 'Hind Siliguri';background:#f4d000;color:#111;cursor:pointer}button.b{background:#0e4fa3;color:#fff}
canvas{width:100%;max-width:480px;border-radius:14px;display:block;margin:auto}a{color:#f4d000}</style>
<div class="w"><div class="c"><a href="index.html">← হোম</a><h3 style="margin:6px 0">⚽ প্লেয়ার কার্ড মেকার</h3>
<label>প্লেয়ারের ছবি</label><input type="file" id="ph" accept="image/*">
<label><input type="checkbox" id="bg" checked style="width:auto"> অটো ব্যাকগ্রাউন্ড রিমুভ</label><label>ছবি জুম</label><input type="range" id="z" min="50" max="250" value="100"><label>ছবি ডানে-বামে</label><input type="range" id="ox" min="-300" max="300" value="0"><label>ছবি উপর-নিচ</label><input type="range" id="oy" min="-300" max="300" value="0">
<label>নাম</label><input id="nm" value="PLAYER NAME"><label>টিম</label><input id="tm" value="TEAM NAME">
<div class="s"><div><label>রেটিং</label><input id="rt" type="number" value="90"></div><div><label>পজিশন</label><input id="ps" value="ST"></div><div><label>জার্সি</label><input id="jn" value="10"></div></div>
<div class="s" id="st"></div><label>কার্ড টাইপ</label><select id="tp"><option value="gold">Gold Legend</option><option value="blue">Blue Special</option><option value="black">Black Elite</option><option value="bw">Simple (সাদা-কালো)</option></select>
<button onclick="dl()">⬇ ডাউনলোড PNG</button><button class="b" onclick="sh()">📤 শেয়ার</button><button class="b" onclick="sub()">✅ আয়োজকদের কাছে জমা দিন</button><p id="m"></p></div>
<canvas id="cv" width="1080" height="1500"></canvas></div>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),g=cv.getContext('2d'),S=['PAC','SHO','PAS','DRI','DEF','PHY'];
$('st').innerHTML=S.map((s,i)=>`<div><label>${s}</label><input type="number" id="s${i}" value="${80+i}"></div>`).join('');
const TP={gold:['#fff1a8','#e0a916','#6b4200','#3a2400'],blue:['#9fd4ff','#2a7de1','#0a2a6b','#04153a'],black:['#7a7a7a','#2b2b2b','#0b0b0b','#000'],bw:['#fff','#ddd','#999','#000']};
let img=null,lg=new Image();lg.src='assets/logo_dark.png';lg.onload=d;
let cut=false;
function crop(i){const k=Math.min(1,1400/Math.max(i.width,i.height)),w=Math.round(i.width*k),h=Math.round(i.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(i,0,0,w,h);
 const a=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;for(let y=0;y<h;y++)for(let q=0;q<w;q++)if(a[(y*w+q)*4+3]>30){if(q<x0)x0=q;if(q>x1)x1=q;if(y<y0)y0=y;if(y>y1)y1=y}
 const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o}
$('ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;let src=f;cut=false;const m=$('m');
 if($('bg').checked){m.textContent='⏳ ব্যাকগ্রাউন্ড রিমুভ হচ্ছে… (প্রথমবার ১-২ মিনিট লাগতে পারে)';
  try{const{removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');src=await removeBackground(f);cut=true;m.textContent='✅ ব্যাকগ্রাউন্ড রিমুভ হয়েছে'}catch(x){m.textContent='⚠ রিমুভ হয়নি, আসল ছবি ব্যবহার হচ্ছে'}}
 const i=new Image();i.onload=()=>{img=cut?crop(i):i;d()};i.src=URL.createObjectURL(src)};
document.querySelectorAll('input,select').forEach(e=>e.oninput=d);
function T(t,x,y,s,w,c,a){g.font=`${w} ${s}px Poppins,'Hind Siliguri',sans-serif`;g.fillStyle=c;g.textAlign=a||'center';g.fillText(t,x,y)}
function d(){const c=TP[$('tp').value],bw=$('tp').value=='bw',tc=bw?'#000':'#fff',W=1080,H=1500;g.clearRect(0,0,W,H);
 g.fillStyle='#071022';g.fillRect(0,0,W,H);
 g.save();g.beginPath();g.moveTo(120,40);g.lineTo(960,40);g.lineTo(1040,140);g.lineTo(1040,1360);g.lineTo(900,1460);g.lineTo(180,1460);g.lineTo(40,1360);g.lineTo(40,140);g.closePath();g.clip();
 let gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,c[0]);gr.addColorStop(.35,c[1]);gr.addColorStop(.75,c[2]);gr.addColorStop(1,c[3]);g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.globalAlpha=.18;g.fillStyle='#fff';for(let i=0;i<6;i++){g.beginPath();g.moveTo(i*220-200,0);g.lineTo(i*220-60,0);g.lineTo(i*220+500,H);g.lineTo(i*220+360,H);g.fill()}g.globalAlpha=1;
 if(img&&cut){const z=$('z').value/100,h=Math.min(950*z,1000*img.height/img.width*z),w=img.width*h/img.height;g.drawImage(img,540-w/2+ +$('ox').value,1060-h+ +$('oy').value,w,h)}else if(img){const z=$('z').value/100,s=Math.max(760/img.width,860/img.height)*z,w=img.width*s,h=img.height*s;g.save();g.beginPath();g.rect(40,150,1000,900);g.clip();
  g.drawImage(img,540-w/2+ +$('ox').value,600-h/2+ +$('oy').value,w,h);g.restore();
  const f=g.createLinearGradient(0,800,0,1060);f.addColorStop(0,'#0000');f.addColorStop(1,c[3]);g.fillStyle=f;g.fillRect(40,800,1000,260)}
 else T('📷 ছবি আপলোড করুন',540,600,48,600,tc);
 T($('rt').value,170,250,150,800,tc);T($('ps').value,170,320,56,800,tc);T('#'+$('jn').value,170,385,44,600,tc);
 if(lg.complete)g.drawImage(lg,820,70,190,230);
 g.fillStyle=bw?'#000':'#00000066';g.fillRect(60,1040,960,110);T($('nm').value.toUpperCase(),540,1120,76,800,bw?'#fff':'#fff','center');
 T($('tm').value.toUpperCase(),540,1190,40,600,tc);
 S.forEach((s,i)=>{const x=150+(i%3)*300,y=1280+Math.floor(i/3)*85;T($('s'+i).value,x,y,60,800,tc,'right');T(s,x+14,y-6,32,600,tc,'left')});
 T('INFT SEASON 3 · 2026',540,1430,30,600,tc);g.restore();g.lineWidth=8;g.strokeStyle=bw?'#000':c[0];g.stroke()}
function dl(){cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='INFT_player_card.png';a.click()})}
async function sh(){cv.toBlob(async b=>{const f=new File([b],'INFT_card.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'INFT Player Card'});else dl()})}
function sub(){cv.toBlob(async b=>{const fd=new FormData();fd.set('jpg',b,'card.png');fd.set('summary',`🃏 Player Card\n${$('nm').value} | ${$('tm').value} | ${$('ps').value} ${$('rt').value}`);
 const r=await fetch('/api/register',{method:'POST',body:fd});$('m').textContent=r.ok?'✅ জমা হয়েছে':'❌ ব্যর্থ'})}
d();
</script></html>
