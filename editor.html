<!DOCTYPE html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INFT A4 Editor</title>
<link rel="stylesheet" href="assets/inft.css"><style>.a4 [contenteditable]:focus,.a4:focus{outline:2px dashed #0e4fa3}</style>
<div class="bar no-print"><a href="index.html">← Home</a><select id="t"></select><button onclick="load()">Load template</button>
<button onclick="ex('bold')"><b>B</b></button><button onclick="ex('fontSize',prompt('Size 1-7',5))">Size</button><button onclick="ex('justifyCenter')">Center</button>
<button onclick="blk('tt')">+ Bar</button><button onclick="blk('tb')">+ Table</button><button onclick="row()">+ Row</button><button onclick="blk('tx')">+ Text</button>
<button onclick="save()">Save</button><button onclick="restore()">Restore</button><button onclick="print()">Print / PDF</button></div>
<div class="a4" id="p" contenteditable="true"></div>
<script>
const H=`<div class="hd"><img src="assets/logo_bw.png"><div><h1>INFT</h1><p>Imambari Night Football Tournament 2026</p><p>S E A S O N 3</p></div></div>`;
const FT=`<div class="ft" contenteditable="true">Contact: ________ &nbsp; Venue: ________ &nbsp; Facebook: ________</div>`;
const tb=(h,n)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${Array(n).fill(`<tr>${h.map(()=>'<td></td>').join('')}</tr>`).join('')}</table>`;
const TPL={Blank:H+FT,Notice:H+`<div class="tt">OFFICIAL ANNOUNCEMENT</div><p style="text-align:right">Date: ___ / ___ / ______</p><p><b>Subject:</b> ________</p><p>Write your notice here…</p>`+FT,
Fixture:H+`<div class="tt">OFFICIAL FIXTURE</div>`+tb(['Match','Date','Time','Team A','VS','Team B','Result'],14)+FT,
Rules:H+`<div class="tt">TOURNAMENT RULES &amp; REGULATIONS</div><ol><li>প্রতি টিমে ১২ জন প্লেয়ার (মূল ৮ + সাব ৪), মাঠে ৮ জন খেলবে।</li><li>&nbsp;</li><li>&nbsp;</li><li>&nbsp;</li><li>&nbsp;</li><li>&nbsp;</li><li>&nbsp;</li></ol><p>&nbsp;</p><p>&nbsp;</p>`+FT,
'Registration Open':H+`<div class="tt">TEAM REGISTRATION IS NOW OPEN</div>`+tb(['Detail','Information'],6).replace(/<td><\/td><td>/,'<td></td><td>')+FT,
Certificate:H+`<div class="tt">CERTIFICATE OF ACHIEVEMENT</div><p style="text-align:center;font-size:18px;margin-top:40px">Awarded to</p><h2 style="text-align:center;border-bottom:2px solid #000;padding:20px">TEAM NAME</h2><p style="text-align:center;font-size:18px">Champion / Runner-up – INFT Season 3</p>`+FT};
const $=i=>document.getElementById(i),p=$('p');$('t').innerHTML=Object.keys(TPL).map(k=>`<option>${k}</option>`).join('');
function load(){p.innerHTML=TPL[$('t').value]}load();
function ex(c,v){document.execCommand(c,false,v)}
function blk(k){const h={tt:'<div class="tt">NEW HEADING</div>',tx:'<p>New text…</p>',tb:tb((prompt('Column names, comma separated','Sl,Name,Info')||'A').split(','),+prompt('Rows',5)||5)}[k];
 const s=getSelection();p.focus();document.execCommand('insertHTML',false,h)}
function row(){const t=getSelection().anchorNode;const tr=(t.nodeType==3?t.parentNode:t).closest('tr');if(tr)tr.after(tr.cloneNode(true)),tr.nextSibling.querySelectorAll('td').forEach(d=>d.textContent='')}
function save(){const n=prompt('Save as name',$('t').value);if(n)localStorage['inft_'+n]=p.innerHTML}
function restore(){const k=Object.keys(localStorage).filter(k=>k.startsWith('inft_')).map(k=>k.slice(5));const n=prompt('Saved pages:\n'+k.join('\n'));if(n&&localStorage['inft_'+n])p.innerHTML=localStorage['inft_'+n]}
</script><script src="assets/site.js" data-banner="0"></script></html>
