[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/bg-data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cross-origin isolation only for the card maker: lets the background-removal wasm use multiple CPU threads (much faster).
[[headers]]
  for = "/card*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
