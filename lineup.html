<!DOCTYPE html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>লাইনআপ ও প্লেয়ার লিস্ট – INFT</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>*{box-sizing:border-box}body{margin:0;background:#071022;color:#fff;font-family:'Hind Siliguri',Poppins,sans-serif}.w{max-width:1150px;margin:0 auto;padding:14px;display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:820px){.w{grid-template-columns:1fr}}.c{background:#101c3a;border-radius:14px;padding:14px}label{font-size:12px;color:#9db0d8;display:block;margin:8px 0 3px}
input,select{width:100%;padding:8px;border-radius:8px;border:1px solid #2c4f95;background:#0a1530;color:#fff;font:inherit}.r{display:grid;grid-template-columns:44px 1fr 40px;gap:5px;margin:4px 0;align-items:center}
.r input[type=file]{padding:3px;font-size:10px}button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;font:700 15px 'Hind Siliguri';background:#f4d000;color:#111;cursor:pointer}
canvas{width:100%;border-radius:12px;background:#fff}a{color:#f4d000}.t{display:flex;gap:6px}.t button{margin:0;background:#1d3568;color:#fff}.t .on{background:#f4d000;color:#111}</style>
<div class="w"><div class="c"><a href="index.html">← হোম</a><h3 style="margin:6px 0">📋 লাইনআপ ও প্লেয়ার লিস্ট</h3>
<div class="t"><button id="m0" onclick="mode(0)">⚪ সিম্পল</button><button id="m1" class="on" onclick="mode(1)">🌈 কালারফুল</button></div>
<label>টিমের নাম</label><input id="tn" value="TEAM NAME"><label>ম্যাচ / তারিখ (ঐচ্ছিক)</label><input id="mt" placeholder="Team A vs Team B · 20 Dec 2026">
<label>ফরমেশন (১ গোলকিপার + ৭ জন)</label><select id="fm"><option>3-3-1</option><option>2-3-2</option><option>3-2-2</option><option>2-4-1</option><option>4-2-1</option><option>1-4-2</option></select>
<label>প্লেয়ার (নম্বর · নাম · ছবি) – ১ নম্বর = গোলকিপার</label><div id="pl"></div>
<button onclick="dl()">⬇ ছবি ডাউনলোড (PNG)</button></div>
<div><canvas id="cv"></canvas><p style="color:#9db0d8;font-size:13px">মাঠ: ১৬০ × ১০০ · ৮ জন প্লেয়ার</p></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),g=cv.getContext('2d'),P=[],R=['GK','DF','DF','DF','MF','MF','MF','FW'];let M=1;
const lg=[new Image(),new Image()];lg[0].src='assets/logo_bw.png';lg[1].src='assets/logo_dark.png';lg.forEach(l=>l.onload=d);
for(let i=0;i<8;i++){P.push({n:i?String(i+1):'1',nm:'',img:null});const r=document.createElement('div');r.className='r';
 r.innerHTML=`<input value="${i+1}" oninput="P[${i}].n=this.value;d()"><input placeholder="প্লেয়ারের নাম" oninput="P[${i}].nm=this.value;d()"><input type="file" accept="image/*">`;
 r.querySelector('[type=file]').onchange=e=>{const im=new Image();im.onload=()=>{P[i].img=im;d()};im.src=URL.createObjectURL(e.target.files[0])};$('pl').appendChild(r)}
document.querySelectorAll('#tn,#mt,#fm').forEach(e=>e.oninput=d);
function mode(m){M=m;$('m0').className=m?'':'on';$('m1').className=m?'on':'';d()}
function pos(){const f=$('fm').value.split('-').map(Number),o=[[.07,.5]];const xs=[.28,.52,.78];let k=0;f.forEach((n,li)=>{for(let j=0;j<n;j++)o.push([xs[li],(j+1)/(n+1)])});return o}
function T(t,x,y,s,w,c,a){g.font=`${w} ${s}px Poppins,'Hind Siliguri',sans-serif`;g.fillStyle=c;g.textAlign=a||'center';g.fillText(t,x,y)}
function d(){const W=1200,H=2090,C=M==1,ink=C?'#fff':'#000';cv.width=W;cv.height=H;
 if(C){const b=g.createLinearGradient(0,0,0,H);b.addColorStop(0,'#0e4fa3');b.addColorStop(.35,'#061a3d');b.addColorStop(1,'#04102a');g.fillStyle=b}else g.fillStyle='#fff';g.fillRect(0,0,W,H);
 if(!C){g.lineWidth=12;g.strokeStyle='#000';g.strokeRect(14,14,W-28,H-28)}
 const L=lg[C?1:0];if(L.complete)g.drawImage(L,50,40,190,230);
 T('INFT',W/2+60,150,120,800,ink);T('IMAMBARI NIGHT FOOTBALL TOURNAMENT 2026',W/2+60,200,30,600,ink);T('SEASON 3 · TEAM LINEUP',W/2+60,250,32,800,C?'#f4d000':'#000');
 g.fillStyle=C?'#f4d000':'#000';g.fillRect(50,295,W-100,100);T($('tn').value.toUpperCase(),W/2,368,68,800,C?'#111':'#fff');
 if($('mt').value)T($('mt').value,W/2,435,34,600,ink);
 // pitch 160x100
 const px=50,py=460,pw=1100,ph=pw*100/160,s=pw/160;
 if(C){const q=g.createLinearGradient(0,py,0,py+ph);q.addColorStop(0,'#1f8a3b');q.addColorStop(1,'#126b2a');g.fillStyle=q;g.fillRect(px,py,pw,ph);g.fillStyle='#ffffff14';for(let i=0;i<8;i+=2)g.fillRect(px+i*pw/8,py,pw/8,ph)}
 else{g.fillStyle='#fff';g.fillRect(px,py,pw,ph)}
 g.strokeStyle=C?'#fff':'#000';g.lineWidth=C?4:5;g.strokeRect(px,py,pw,ph);g.beginPath();g.moveTo(px+pw/2,py);g.lineTo(px+pw/2,py+ph);g.stroke();
 g.beginPath();g.arc(px+pw/2,py+ph/2,10*s,0,7);g.stroke();
 [[0,1],[1,-1]].forEach(([e,sg])=>{const x=e?px+pw:px;g.strokeRect(sg>0?x:x-18*s,py+ph/2-25*s,18*s,50*s);g.strokeRect(sg>0?x:x-6*s,py+ph/2-10*s,6*s,20*s)});
 pos().forEach(([fx,fy],i)=>{const p=P[i],x=px+fx*pw,y=py+fy*ph,r=C?50:38;
  g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();
  if(C&&p.img){const k=Math.max(2*r/p.img.width,2*r/p.img.height);g.drawImage(p.img,x-p.img.width*k/2,y-p.img.height*k/2,p.img.width*k,p.img.height*k)}
  else{g.fillStyle=C?(i?'#0e4fa3':'#e52421'):'#000';g.fillRect(x-r,y-r,2*r,2*r);T(p.n,x,y+16,46,800,'#fff')}g.restore();
  g.lineWidth=C?6:3;g.strokeStyle=C?'#f4d000':'#000';g.beginPath();g.arc(x,y,r,0,7);g.stroke();
  const nm=(p.nm||R[i]).toUpperCase(),w=Math.min(g.measureText(nm).width+30,200);g.font='700 24px Poppins,sans-serif';const tw=Math.min(g.measureText(nm).width+28,190);
  g.fillStyle=C?'#061a3dcc':'#fff';g.fillRect(x-tw/2,y+r+4,tw,34);if(!C){g.lineWidth=2;g.strokeStyle='#000';g.strokeRect(x-tw/2,y+r+4,tw,34)}
  g.save();g.beginPath();g.rect(x-tw/2,y+r+4,tw,34);g.clip();T(nm,x,y+r+30,22,700,C?'#fff':'#000');g.restore()});
 // list
 let y=py+ph+50;g.fillStyle=C?'#f4d000':'#000';g.fillRect(50,y,W-100,64);T('PLAYER LIST',W/2,y+45,38,800,C?'#111':'#fff');y+=72;
 P.forEach((p,i)=>{g.fillStyle=C?(i%2?'#ffffff12':'#ffffff22'):(i%2?'#eee':'#fff');g.fillRect(50,y,W-100,86);if(!C){g.lineWidth=2;g.strokeStyle='#000';g.strokeRect(50,y,W-100,86)}
  g.save();g.beginPath();g.arc(120,y+43,34,0,7);g.clip();if(p.img){const k=Math.max(68/p.img.width,68/p.img.height);g.drawImage(p.img,120-p.img.width*k/2,y+43-p.img.height*k/2,p.img.width*k,p.img.height*k)}else{g.fillStyle=C?'#0e4fa3':'#000';g.fillRect(80,y,80,86)}g.restore();
  T(p.n,230,y+58,46,800,C?'#f4d000':'#000');T((p.nm||'—').toUpperCase(),300,y+57,40,700,ink,'left');T(R[i],W-90,y+55,32,800,C?'#9db0d8':'#555','right');y+=90});
 T('INFT SEASON 3 · 2026',W/2,H-36,28,600,ink)}
function dl(){cv.toBlob(b=>saveBlob(b,'INFT_lineup_'+($('tn').value||'team').replace(/[^\w\u0980-\u09FF-]+/g,'_')+'.png'),'image/png')}
d();
</script><script src="assets/site.js" data-title="লাইনআপ ও প্লেয়ার লিস্ট" data-sub="ফরমেশন সাজিয়ে ছবি ডাউনলোড করুন"></script></html>
