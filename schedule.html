<!DOCTYPE html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>শিডিউল – INFT সিজন ৩</title>
<link rel="stylesheet" href="assets/fonts.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>:root{--y:#f4d000;--b:#0e4fa3}*{box-sizing:border-box}body{margin:0;background:#071022;color:#fff;font-family:'Hind Siliguri',Poppins,sans-serif}a{color:var(--y);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}.w{max-width:900px;margin:0 auto;padding:0 12px 60px}h1{margin:0;font-size:24px}.tabs{display:flex;gap:6px;margin:10px 0;position:sticky;top:60px;background:#071022;padding:8px 0;z-index:5}
.tabs button{flex:1;padding:11px 4px;border:0;border-radius:10px;background:#1d3568;color:#fff;font:700 14px inherit;font-family:inherit}.tabs .on{background:var(--y);color:#111}
.gc{background:#101c3a;border-radius:16px;padding:12px;margin-bottom:14px}.gc h3{margin:0 0 8px;background:var(--b);display:inline-block;padding:4px 16px;border-radius:20px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}th{color:#9db0d8;font-weight:600}td,th{padding:6px 3px;text-align:center}td:nth-child(2),th:nth-child(2){text-align:left;width:40%}tr:nth-child(-n+3) td:first-child{color:var(--y);font-weight:700}tbody tr:nth-child(-n+2){background:#1f8a3b33}
.mc{background:#0a1530;border:1px solid #2c4f95;border-radius:14px;padding:10px;margin:8px 0}.mh{display:flex;justify-content:space-between;font-size:12px;color:#9db0d8;gap:8px;flex-wrap:wrap}
.mr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px;font-weight:700}.mr span:first-child{text-align:right}.sc{min-width:34px;height:34px;background:#fff;color:#111;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.mr div{display:flex;gap:4px;align-items:center}input,select{background:#fff;color:#111;border:1px solid #888;border-radius:7px;padding:6px;font:inherit;max-width:100%}input.sc{width:44px;text-align:center;padding:0}.tn{width:100%;margin:3px 0}
h4{margin:16px 0 4px;color:var(--y)}#sv{position:fixed;left:14px;bottom:14px;background:var(--y);color:#111;border:0;border-radius:30px;padding:13px 22px;font:700 15px inherit;font-family:inherit;display:none;z-index:9}.nt{font-size:12px;color:#9db0d8}</style>
<div class="top"><span></span><a href="#" onclick="adm();return false">অ্যাডমিন</a></div><div class="w"><h1>📅 INFT সিজন ৩ – শিডিউল</h1><p class="nt">১৬ দল · সরাসরি নকআউট · হারলেই বিদায় · ১৫টি ম্যাচ</p>
<div class="tabs"><button id="t0" onclick="tab(0)">রাউন্ড অনুযায়ী</button><button id="t1" onclick="tab(1)">ব্লক A–D ও দল</button></div><div id="v"></div>
<button onclick="img()" style="width:100%;padding:12px;border:0;border-radius:10px;background:var(--b);color:#fff;font:700 15px inherit;font-family:inherit">🖼 শিডিউল ছবি ডাউনলোড</button></div><button id="sv" onclick="save()">💾 সেভ করুন</button>
<script>
const $=i=>document.getElementById(i),GN=['A','B','C','D'],RR=[[0,1],[2,3],[0,2],[3,1],[3,0],[1,2]];let T={g:{A:[],B:[],C:[],D:[]},m:{}},AD=false,PW='',TB=0;
const ML=[];(()=>{let n=1;GN.forEach(g=>{[[0,1],[2,3]].forEach(([x,y])=>ML.push({id:'M'+n,n,k:n++,s:'রাউন্ড অফ ১৬ · ব্লক '+g,g,x,y}))});
['কোয়ার্টার ফাইনাল ১|W1|W2','কোয়ার্টার ফাইনাল ২|W3|W4','কোয়ার্টার ফাইনাল ৩|W5|W6','কোয়ার্টার ফাইনাল ৪|W7|W8','সেমি ফাইনাল ১|W9|W10','সেমি ফাইনাল ২|W11|W12','ফাইনাল|W13|W14'].forEach(q=>{const p=q.split('|');ML.push({id:'M'+n,n,k:n++,s:p[0],x:p[1],y:p[2]})})})();
const mm=id=>T.m[id]||(T.m[id]={}),has=v=>v!==undefined&&v!==''&&v!==null,played=m=>{const r=mm(m.id);return has(r.a)&&has(r.b)};
const nm=(g,i)=>(T.g[g]&&T.g[g][i])||`ব্লক ${g} – দল ${i+1}`;
function side(m,s){const r=s?m.y:m.x;if(m.g)return nm(m.g,r);const q=ML.find(z=>z.k==+r.slice(1));return win(q)||`ম্যাচ ${q.n}-এর বিজয়ী`}
function win(m){const r=mm(m.id);if(!played(m))return'';const a=+r.a,b=+r.b;return a>b?side(m,0):b>a?side(m,1):r.w==='a'?side(m,0):r.w==='b'?side(m,1):''}
function when(r){if(!r.d&&!r.t)return'তারিখ ঘোষণা হবে';let s='';try{if(r.d)s=new Date(r.d+'T00:00').toLocaleDateString('bn-BD',{weekday:'short',day:'numeric',month:'short'});if(r.t)s+=' · '+new Date('1970-01-01T'+r.t).toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'})}catch(e){}return s}
function card(m){const r=mm(m.id),A=side(m,0),B=side(m,1),p=played(m);let h=`<div class="mc"><div class="mh"><span>ম্যাচ ${m.n} · ${m.s}</span><span>${AD?`<input type=date value="${r.d||''}" onchange="up('${m.id}','d',this.value)"> <input type=time value="${r.t||''}" onchange="up('${m.id}','t',this.value)">`:'🕒 '+when(r)}</span></div>`;
 h+=`<div class="mr"><span>${A}</span><div>${AD?`<input class=sc type=number min=0 value="${r.a??''}" onchange="up('${m.id}','a',this.value)">:<input class=sc type=number min=0 value="${r.b??''}" onchange="up('${m.id}','b',this.value)">`:`<span class=sc>${p?r.a:'-'}</span>:<span class=sc>${p?r.b:'-'}</span>`}</div><span style="text-align:left">${B}</span></div>`;
 if(AD&&p&&r.a==r.b)h+=`<select onchange="up('${m.id}','w',this.value)"><option value="">পেনাল্টিতে জয়ী?</option><option value="a" ${r.w=='a'?'selected':''}>${A}</option><option value="b" ${r.w=='b'?'selected':''}>${B}</option></select>`;
 if(m.id=='M15'&&win(m))h+=`<p style="text-align:center;color:var(--y);font-weight:800;margin:8px 0 0">🏆 চ্যাম্পিয়ন: ${win(m)}</p>`;return h+'</div>'}
function render(){[0,1].forEach(i=>$('t'+i).className=i==TB?'on':'');let h='';
 if(TB==0)['রাউন্ড অফ ১৬','কোয়ার্টার ফাইনাল','সেমি ফাইনাল','ফাইনাল'].forEach(s=>{h+=`<h4>${s}</h4>`+ML.filter(m=>m.s.startsWith(s)).map(card).join('')});
 else GN.forEach((g,gi)=>{h+=`<div class="gc"><h3>ব্লক ${g}</h3>`+[0,1,2,3].map(i=>AD?`<input class="tn" placeholder="দল ${i+1} এর নাম" value="${(T.g[g][i]||'').replace(/"/g,'&quot;')}" onchange="T.g['${g}'][${i}]=this.value;render()">`:`<div style="padding:4px 0">${i+1}. <b>${nm(g,i)}</b></div>`).join('')+ML.filter(m=>m.g===g||m.k===9+gi).map(card).join('')+'</div>'});
 $('v').innerHTML=h}
function tab(i){TB=i;render()}function up(id,k,v){mm(id)[k]=v;render()}
async function adm(){const p=prompt('অ্যাডমিন পাসওয়ার্ড');if(!p)return;PW=p;AD=true;$('sv').style.display='block';render()}
async function save(){const c=await fetch('/api/content').then(r=>r.json()).catch(()=>({}));c.tour=T;const r=await fetch('/api/content',{method:'PUT',headers:{'x-admin':PW},body:JSON.stringify(c)});alert(r.ok?'সেভ হয়েছে ✅':'পাসওয়ার্ড ভুল বা KV সেট নেই ❌')}
async function img(){const was=AD;AD=false;render();const body=$('v').innerHTML;AD=was;render();
 const w=document.createElement('div');w.style.cssText='position:fixed;left:-9999px;top:0;width:900px;background:#071022;color:#fff;font-family:"Hind Siliguri",Poppins,sans-serif';
 w.innerHTML=`<div style="position:relative;background:url(assets/banner.jpg) center/cover;border-bottom:4px solid #f4d000"><div style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(6,26,61,.82)"></div><div style="position:relative;display:flex;align-items:center;gap:20px;padding:22px 26px"><img src="assets/logo_hero.png" style="height:120px;width:auto"><div><div style="font:800 46px/1 Poppins,sans-serif">INFT</div><div style="font:600 18px 'Hind Siliguri',sans-serif;color:#f4d000;margin-top:6px">ইমামবাড়ী নাইট ফুটবল টুর্নামেন্ট ২০২৬ · সিজন ৩</div><div style="font:700 24px 'Hind Siliguri',sans-serif;margin-top:6px">ম্যাচ শিডিউল</div></div></div></div><div style="padding:8px 20px 14px">${body}</div><div style="text-align:center;padding:12px;background:#061a3d;border-top:3px solid #f4d000;font:600 15px 'Hind Siliguri',sans-serif;color:#dbe6ff">INFT SEASON 3 · ২০২৬ · ইমামবাড়ী</div>`;
 document.body.appendChild(w);await document.fonts.ready;await Promise.all([...w.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>i.onload=i.onerror=r)));
 try{const sc=Math.max(1,Math.min(2,Math.sqrt(12e6/(900*w.offsetHeight)))),c=await html2canvas(w,{scale:sc,backgroundColor:'#071022'});await new Promise(r=>c.toBlob(b=>{saveBlob(b,'INFT_schedule.png');r()},'image/png'))}finally{w.remove()}}
fetch('/api/content').then(r=>r.json()).then(c=>{if(c.tour){T=c.tour;T.g=T.g||{};GN.forEach(g=>T.g[g]=T.g[g]||[]);T.m=T.m||{}}}).catch(()=>{}).finally(render);
</script><script src="assets/site.js" data-title="ম্যাচ শিডিউল" data-sub="১৬ দল · সরাসরি নকআউট · ১৫টি ম্যাচ"></script></html>
