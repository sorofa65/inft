<!DOCTYPE html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>টিম রেজিস্ট্রেশন – INFT সিজন ৩</title>
<link rel="stylesheet" href="assets/inft.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>body{font-family:'Hind Siliguri',Poppins,sans-serif}.w{max-width:760px;margin:0 auto;padding:12px}.c{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
label{font-size:13px;font-weight:600;display:block;margin:10px 0 3px}input,select{width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;font:inherit;font-size:16px;background:#fff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.p{display:grid;grid-template-columns:30px 1fr 70px 100px;gap:6px;margin:6px 0;align-items:center}.p input{padding:9px;font-size:15px}.p.sub b{font-size:11px}
.fee{background:#fff8d6;border:2px solid #f4d000}.fee ol{padding-left:20px;margin:6px 0;line-height:1.6;font-size:14px}.k{display:flex;gap:8px;flex-wrap:wrap}.k span{flex:1;min-width:90px;background:#0e4fa3;color:#fff;border-radius:10px;padding:8px;text-align:center;font-weight:700}
button.s{width:100%;padding:14px;background:#0e4fa3;color:#fff;border:0;border-radius:10px;font:600 16px 'Hind Siliguri';margin-top:8px}#o{position:fixed;left:-9999px;top:0}.hp{display:none}
.pv{max-width:100%;max-height:200px;border-radius:10px;margin-top:6px;display:none}progress{width:100%;display:none;margin-top:6px}
.em .bar{display:none}.em .w{padding:4px}@media(max-width:560px){.g{grid-template-columns:1fr}.p{grid-template-columns:30px 1fr 64px}.p input:nth-of-type(3){grid-column:2/4}}</style>
<script>if(/embed/.test(location.search))document.documentElement.className='em'</script><div class="w">
<div class="c fee"><b>💰 ফি ও পেমেন্টের নিয়ম</b><div class="k" style="margin-top:6px"><span>ফি ৳<i id="k1"></i></span><span>অগ্রিম ৳<i id="k2"></i></span><span>খেলার দিন ৳<i id="k3"></i></span></div><ol id="fr"></ol></div>
<div class="c"><h2 style="margin:0">টিম রেজিস্ট্রেশন ফরম</h2><div class="g" id="fl"></div><input class="hp" id="website" tabindex="-1" autocomplete="off"></div>
<div class="c"><b>প্লেয়ার লিস্ট</b> <small>– মূল দল ৮ জন (গোলরক্ষকসহ) + সাব ৪ জন = মোট ১২ জন</small><div id="pl"></div></div>
<div class="c"><b>📎 পেমেন্টের স্ক্রিনশট (ছবি)</b><input type="file" id="shot" accept="image/*"><img class="pv" id="pvi">
<label>🎥 ভিডিও (ঐচ্ছিক, সর্বোচ্চ ৪৫ MB)</label><input type="file" id="vid" accept="video/*"><progress id="pg" max="100" value="0"></progress></div>
<div class="c"><b>⬇ ডাউনলোড (A4 PDF)</b><button class="s" style="background:#1f8a3b" id="dblank">📄 ফাঁকা রেজিস্ট্রেশন ফর্ম ডাউনলোড (অফলাইন – প্রিন্ট করে পূরণ)</button><button class="s" style="background:#444" id="dd">✍ পূরণ করা ফর্ম ডাউনলোড (A4)</button><button class="s" style="background:#d98d00" id="drl">📜 সব নিয়ম ডাউনলোড (A4)</button></div><button class="s" id="go">✅ জমা দিন (Submit)</button><p id="msg" style="text-align:center;font-weight:600"></p></div><div id="o"></div>
<script src="assets/sheet.js"></script><script>
$('k1').textContent=bn(FEE.t);$('k2').textContent=bn(FEE.a);$('k3').textContent=bn(FEE.d);$('fr').innerHTML=li(FR);
const T=['text','text','text','text','tel','tel','text','text','text','text','text','text'];
$('fl').innerHTML=FL.map((f,i)=>`<div><label>${f[0]}${[0,2,4].includes(i)?' *':''} <small style="font-weight:400;color:#666">${f[1]}</small></label><input data-f="${i}" type="${T[i]}" ${i==4||i==5?'inputmode="numeric"':''}></div>`).join('');
$('pl').innerHTML=Array.from({length:12},(_,i)=>`<div class="p ${i>7?'sub':''}"><b>${i<8?bn(i+1):'সাব'}</b><input placeholder="${i<8?'প্লেয়ারের নাম':'সাব প্লেয়ারের নাম'}"><input placeholder="জার্সি" inputmode="numeric"><input placeholder="পজিশন"></div>`).join('');
$('fl').querySelector('[data-f="11"]').value=new Date().toLocaleDateString('en-GB');
$('shot').onchange=e=>{const f=e.target.files[0],p=$('pvi');if(f){p.src=URL.createObjectURL(f);p.style.display='block'}else p.style.display='none'};
function data(){const v=[...document.querySelectorAll('[data-f]')].map(i=>i.value.trim());const pl=[...document.querySelectorAll('.p')].map(r=>[...r.querySelectorAll('input')].map(i=>i.value.trim()));return{v,pl}}
function ok(d){const m=$('msg');if(!d.v[0]||!d.v[2]||!d.v[4]){m.textContent='দলের নাম, ম্যানেজারের নাম ও মোবাইল নম্বর দিন।';return false}if(d.pl.slice(0,8).filter(r=>r[0]).length<8){m.textContent='মূল দলের ৮ জন প্লেয়ারের নাম দিন।';return false}return true}
$('dblank').onclick=()=>dlOne('f',{v:[],pl:[]},$('msg'));
$('dd').onclick=()=>{const d=data();if(ok(d))dlOne('f',d,$('msg'))};
$('drl').onclick=()=>dlOne('r',data(),$('msg'));
$('go').onclick=async()=>{const d=data(),m=$('msg'),sh=$('shot').files[0],vd=$('vid').files[0];if(!ok(d))return;
 if(vd&&vd.size>45*1024*1024){m.textContent='ভিডিও ৪৫ MB এর বেশি। ছোট ভিডিও দিন।';return}
 $('go').disabled=true;m.textContent='⏳ পাঠানো হচ্ছে… অপেক্ষা করুন';
 try{const r=await build(d),fd=new FormData();fd.set('jpg',await (await fetch(r.jpg)).blob(),'f.jpg');fd.set('pdf',r.both.output('blob'),'f.pdf');if(sh)fd.set('shot',sh,sh.name);if(vd)fd.set('video',vd,vd.name);fd.set('website',$('website').value);
  const pl=d.pl.filter(p=>p[0]).map((p,i)=>`${i+1}. ${p[0]}${p[1]?' ('+p[1]+')':''}`).join('\n');
  fd.set('summary',`🆕 নতুন টিম রেজিস্ট্রেশন – INFT S3\nদল: ${d.v[0]}\nম্যানেজার: ${d.v[2]} | ক্যাপ্টেন: ${d.v[3]}\nফোন: ${d.v[4]} | WA: ${d.v[5]}\nপেমেন্ট: ${d.v[8]} ${d.v[9]} | ৳${d.v[10]}\n\nপ্লেয়ার:\n${pl}`);
  const x=new XMLHttpRequest();x.open('POST','/api/register');x.upload.onprogress=e=>{if(e.lengthComputable){$('pg').style.display='block';$('pg').value=e.loaded/e.total*100}};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}$('go').disabled=false;m.textContent=x.status==200?'✅ জমা হয়েছে। ধন্যবাদ!'+(j.failed&&j.failed.length?' (⚠ '+j.failed.join(', ')+' পাঠানো যায়নি)':''):'❌ ব্যর্থ: '+(j.error||x.status)};
  x.onerror=()=>{$('go').disabled=false;m.textContent='❌ নেটওয়ার্ক সমস্যা, আবার চেষ্টা করুন'};x.send(fd)}catch(e){m.textContent='❌ Error: '+e.message;$('go').disabled=false}};
</script><script src="assets/site.js" data-title="টিম রেজিস্ট্রেশন" data-sub="মূল ৮ + সাব ৪ = ১২ জন · এন্ট্রি ফি ৳৩৫০০"></script></html>
